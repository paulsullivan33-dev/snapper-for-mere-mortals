site_name: Snapper for Mere Mortals
site_description: A plain language guide to Snapper, the snapshot manager for Btrfs. Making timeline and before-and-after snapshots, pruning them with cleanup rules, recovering single files, and rolling a whole system back, with an honest account of what a snapshot cannot do.
site_url: https://paulsullivan33-dev.github.io/snapper-for-mere-mortals/
